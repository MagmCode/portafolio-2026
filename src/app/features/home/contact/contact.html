<section id="contacto" appScrollAnimate class="mx-auto max-w-6xl px-4 py-16 sm:px-6 lg:px-8 lg:py-24">
  <div class="mb-8">
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-secondary-500">Contacto</p>
    <h2 class="mt-3 text-2xl font-semibold text-neutral-100 sm:text-3xl">Hablemos sobre tu siguiente proyecto</h2>
  </div>

  <div appCursorGlow
    class="relative grid gap-6 overflow-hidden rounded-3xl border border-accent-primary/25 bg-neutral-800/70 p-6 shadow-soft backdrop-blur-xl md:grid-cols-2 md:p-10">
    <div>
      <p class="text-neutral-400">Disponible para colaboraciones frontend y productos digitales de alto impacto.
      </p>

      <div class="mt-8 flex items-center gap-2.5">
        <span class="availability-dot h-2 w-2"></span>
        <span class="text-xs font-medium uppercase tracking-[0.14em] text-neutral-300">Disponible para proyectos</span>
      </div>

      <div class="mt-6 flex gap-3">
        <a class="icon-btn rounded-full border border-white/20 p-3 text-neutral-100 transition hover:border-accent-secondary hover:text-accent-secondary"
          [href]="contact().linkedin" target="_blank" rel="noreferrer" aria-label="LinkedIn">
          <ng-icon name="ionLogoLinkedin" size="18" aria-hidden="true"></ng-icon>
        </a>
        <a class="icon-btn rounded-full border border-white/20 p-3 text-neutral-100 transition hover:border-accent-secondary hover:text-accent-secondary"
          [href]="contact().github" target="_blank" rel="noreferrer" aria-label="GitHub">
          <ng-icon name="octMarkGithub" size="18" aria-hidden="true"></ng-icon>
        </a>
        <a class="icon-btn rounded-full border border-white/20 p-3 text-neutral-100 transition hover:border-accent-secondary hover:text-accent-secondary"
          [href]="contact().whatsapp" target="_blank" rel="noreferrer" aria-label="WhatsApp">
          <ng-icon name="ionLogoWhatsapp" size="18" aria-hidden="true"></ng-icon>
        </a>
      </div>
    </div>

    <div class="space-y-4 text-sm">
      <p class="text-neutral-100">Email: <a class="text-secondary-500 transition hover:text-accent-primary"
          [href]="'mailto:' + contact().email">{{ contact().email }}</a></p>
      <p class="text-neutral-100">Teléfono: <a class="text-secondary-500 transition hover:text-accent-primary"
          [href]="'tel:' + contact().phone">{{ contact().phone }}</a></p>
      <p class="text-neutral-100">
        WhatsApp:
        <a class="text-secondary-500 transition hover:text-accent-primary" [href]="contact().whatsapp" target="_blank"
          rel="noreferrer">
          {{ contact().phone }}
        </a>
      </p>
    </div>
  </div>
</section>
